<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloom Card Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans:wght@600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: the cards grouped by how close they are to review. Dark, to sit beside the
   developer's editor and terminals. */
:root {
  --bg: #0d1015; --surface: #141920; --fg: #e6eaf0; --muted: #8b95a5; --line: #232a35;
  --accent: #5eb1ff; --you: #ffb454; --you-bg: #3a2a12; --agent: #7fd1ae; --agent-bg: #13302a;
  --idle: #8b95a5; --idle-bg: #1c222b;
  --font-body: "Geist", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --radius: 10px;
  --radius-sm: 4px;
  color-scheme: dark;
}
.table-scroll { box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6); }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.table-scroll { scrollbar-color: var(--line) transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
/* The tool bar across the top; the decider's served forms carry the same one. */
.toolbar { background: #15171C; color: #fff; }
.toolbar-row { max-width: 1040px; min-height: 40px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.toolbar-mark { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: #2563EB; flex: none; }
.toolbar-name { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar-who { margin-left: auto; font-family: var(--font-body); font-size: 14px; font-weight: 500; color: #E6EAF0; font-variant-numeric: tabular-nums; }
.toolbar-tag { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 12px; color: #C9CDD4; border: 1px solid #3A3E47; border-radius: 999px; padding: 2px 10px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
header h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); }
#note { color: var(--you); }
/* Each group's heading sits close to its own table and well clear of the table above. */
#groups { display: grid; gap: 40px; }
section.group { display: grid; gap: 12px; }
section.group > h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
section.group > p.sub { margin: -10px 0 0; color: var(--muted); font-size: 13px; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px;  letter-spacing: .06em; color: var(--muted); font-weight: 500; }
td.card { width: 260px; }
/* Title, then the card id and its State, then the PR, worktree and folder: one gap between the
   three groups, a smaller one inside the last. */
.card-cell { display: flex; flex-direction: column; gap: 6px; }
.card-cell .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
td.card .id { font-family: var(--font-mono); font-size: 12.5px; }
td.card .title { color: var(--fg); font-weight: 600; line-height: 1.3; }
td.who { width: 150px; }
td.upd { width: 100px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.next { display: block; color: var(--fg); margin-top: 3px; font-size: 13px; }
.next b { font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.you { color: var(--you); background: var(--you-bg); }
.pill.agent { color: var(--agent); background: var(--agent-bg); }
.pill.idle { color: var(--idle); background: var(--idle-bg); }
a.orca { font-weight: 500; white-space: nowrap; }
.yt { display: inline-block; padding: 1px 7px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; color: var(--fg); background: var(--idle-bg); box-shadow: inset 0 0 0 1px var(--muted); white-space: nowrap; vertical-align: 1px; }
.yt.st-in-progress { color: var(--surface); background: var(--accent); box-shadow: none; }
.yt.st-has-comments { color: var(--surface); background: var(--you); box-shadow: none; }
.pill-link { font: inherit; font-size: 12px; font-weight: 500; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px currentColor; }
.pill-link:hover { filter: brightness(0.95); }
.pill-link::after { content: " \2197"; }
.wt { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
button.orca { font: inherit; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; white-space: nowrap; }
button.orca:hover { text-decoration: underline; }
button.orca:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
td.card .links { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13px; line-height: 1.35; }
button.orca.wt { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
button.orca.skill { display: inline-block; padding: 1px 8px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px currentColor; }
button.orca.skill:hover { text-decoration: none; background: var(--agent-bg); }
.question { display: block; margin-top: 3px; font-size: 13px; color: var(--you); }
</style>
</head>
<body>
<div class="toolbar" role="banner">
  <div class="toolbar-row">
    <span class="toolbar-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M8 3H3v5M12 22v-8.3a4 4 0 0 0-1.17-2.87L3 3M15 9l6-6"/></svg></span>
    <span class="toolbar-name">Dashboard</span>
    <span class="toolbar-tag">bloom-team skill</span>
    <span class="toolbar-who" id="bar-who"></span>
  </div>
</div>

<div class="wrap">
  <header>
    <h1 id="heading">Your active cards</h1>
    <p id="note" hidden></p>
  </header>

  <div id="groups"></div>
</div>

<script>
const GROUPS = [
  { key: "near", name: "Nearly ready: re-check and promote", sub: "Small PRs with clean bot reviews; mostly a master merge and preflight away." },
  { key: "nopr", name: "Work done, but no PR yet", sub: "Pushed branches that preflight would turn into PRs." },
  { key: "large", name: "Large, or waiting on something else", sub: "Big diffs, or blocked on other work." },
  { key: "cleanup", name: "Cleanup", sub: "Cards that have sat In Progress for years with nothing happening." },
];
// The Status pill: "you" when Claude has asked the developer something, "agent" while an agent
// works, labelled with the skill it was started on when that skill is one of these.
const STATUS = { you: "Claude has a question", agent: "Agent working" };
const SKILL_STATUS = { "preflight": "Preflighting", "pr-ready-for-human": "Readying for human review" };
// The skills a row's nextSkill may name, and the button that runs each in the worktree's session.
const SKILL_BUTTON = { "preflight": "Preflight", "pr-ready-for-human": "Make ready for reviewer" };

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function link(href, text) {
  return el("a", { href, target: "_blank", rel: "noopener" }, text);
}
// The server that served this page runs the orca commands. DASHBOARD_TOKEN is written into the
// page by server.mjs; other web pages can't read it, so they can't post to the server.
async function post(path, body) {
  showNote("");
  try {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-dashboard-token": window.DASHBOARD_TOKEN }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) showNote("Orca couldn't do that: " + (j.error || r.status));
  } catch (e) {
    showNote("The dashboard server isn't answering. Is its Claude session still open?");
  }
}
function action(cls, title, text, onClick) {
  const b = el("button", { type: "button", class: cls, title }, text);
  b.addEventListener("click", onClick);
  return b;
}
function orcaLink(path, text) {
  return action("orca", "Show this worktree in Orca", text || "Open in Orca", () => post("/api/open", { path }));
}
// A card with no worktree gets a button that makes one and starts Claude in it.
function createLink(d, text) {
  return action("orca", d.pr ? "Make a worktree on this PR's branch and start Claude in it" : "Make a worktree on a new branch for this card and start Claude in it",
    text || "Create & Open Orca Worktree", () => post("/api/create", { card: d.card, title: d.title || "", pr: d.pr || "" }));
}
// The link for a row: open its worktree, or create one when the row is a single card without one.
function rowLink(d, text) {
  if (d.worktree) return orcaLink(d.worktree, text);
  if (/^BL-\d+$/.test(d.card || "")) return createLink(d, text);
  return null;
}
// The Status pill opens the row's worktree whenever there is one.
function statusPill(d) {
  if (!STATUS[d.who]) return null;
  const cls = "pill " + d.who;
  const text = (d.who === "agent" && SKILL_STATUS[d.skill]) || STATUS[d.who];
  const a = rowLink(d, text);
  if (!a) return el("span", { class: cls }, text);
  a.className = cls + " pill-link";
  return a;
}
function skillButton(d) {
  if (!d.worktree || !SKILL_BUTTON[d.nextSkill]) return null;
  return action("orca skill", "Run /" + d.nextSkill + " in this worktree's Claude session", SKILL_BUTTON[d.nextSkill],
    () => post("/api/run-skill", { path: d.worktree, skill: d.nextSkill }));
}
function cardLabel(d) {
  return d.cardUrl ? link(d.cardUrl, d.card) : document.createTextNode(d.card || "");
}

function render(items) {
  const groups = document.getElementById("groups");
  groups.replaceChildren();
  for (const g of GROUPS) {
    const rows = items.filter(d => d.group === g.key).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    if (!rows.length) continue;
    const tbody = el("tbody");
    for (const d of rows) {
      // The card column: the card and its State, its title, then its PR, its Orca worktree and the
      // worktree's folder, which opens in VS Code.
      const cell = el("div", { class: "card-cell" },
        el("span", { class: "title" }, d.title || ""),
        el("span", { class: "meta" },
          el("span", { class: "id" }, cardLabel(d)),
          d.ytState ? el("span", { class: "yt st-" + d.ytState.toLowerCase().replace(/\s+/g, "-") }, d.ytState) : null));
      const card = el("td", { class: "card" }, cell);
      const links = el("span", { class: "links" });
      if (d.pr) links.append(link(d.pr, "PR " + d.pr.split("/").pop()));
      if (d.worktree) links.append(orcaLink(d.worktree, "Orca Worktree"),
        action("orca wt", "Open this folder in VS Code", d.worktree, () => post("/api/vscode", { path: d.worktree })));
      else { const c = rowLink(d); if (c) links.append(c); }
      if (links.childNodes.length) cell.append(links);
      tbody.append(el("tr", {},
        card,
        el("td", { class: "who" }, statusPill(d)),
        el("td", {}, d.status || "",
          d.question ? el("span", { class: "question" }, el("b", {}, "Claude asks: "), d.question) : null,
          d.next || d.nextSkill ? el("span", { class: "next" }, el("b", {}, "Next: "), d.next || "", " ", skillButton(d)) : null),
        el("td", { class: "upd" }, (d.updated || "").replace("T", " ").slice(5, 16)),
      ));
    }
    const table = el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Card"), el("th", {}, "Status"), el("th", {}, "Progress"), el("th", {}, "Updated"))),
      tbody);
    groups.append(el("section", { class: "group" }, el("h2", {}, g.name), el("p", { class: "sub" }, g.sub), el("div", { class: "table-scroll" }, table)));
  }
}

function showNote(text) {
  const n = document.getElementById("note");
  n.textContent = text || "";
  n.hidden = !text;
}

// Orca's live agent states override the Status that Claude last wrote: a waiting agent means
// Claude has a question, a working one means an agent has the card.
function withLiveAgents(rows, agents) {
  return rows.map(d => {
    const a = d.worktree && agents[d.worktree.replace(/\\/g, "/").toLowerCase()];
    if (!a) return d;
    if (a.waiting) return { ...d, who: "you", question: a.question || "" };
    if (a.working) return { ...d, who: "agent", skill: a.skill || "" };
    return d;
  });
}

let lastJson = "";
async function refresh() {
  let state;
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    state = await r.json();
  } catch {
    showNote("The dashboard server isn't answering. It runs only while its Claude session is open; run /dashboard to start it again.");
    return;
  }
  const json = JSON.stringify(state);
  if (json === lastJson) return;
  lastJson = json;
  showNote(state.rows.length ? "" : "No cards yet. Claude adds them after gathering.");
  const version = (state.board || "").replace(/^Bloom\s+/i, "");
  const text = version ? "Your active cards for version " + version : "Your active cards";
  document.getElementById("heading").textContent = text;
  document.getElementById("bar-who").textContent = [state.developer, version].filter(Boolean).join(" · ");
  render(withLiveAgents(state.rows, state.agents));
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
