<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worktree</title>
<!-- The dashboard's own styles; the rules below only lay its row out for a narrow sidebar. -->
<link rel="stylesheet" href="../dashboard.css">
<style>
:root { --bg: var(--orca-background, #0d1015); }
/* minmax(0, 1fr): a long path or prompt wraps inside a narrow sidebar instead of widening the page. */
/* The panel fills the sidebar's height, so that Recent prompts sits at its bottom edge: after the
   rest when that is short, and kept in view at the bottom while the rest scrolls when it is long. */
.panel { box-sizing: border-box; min-height: 100vh; padding: 12px 12px 0; display: flex; flex-direction: column; gap: 20px; }
.panel > * { min-width: 0; }
#main { flex: 1; display: flex; flex-direction: column; gap: 20px; }
.panel-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.prompts-dock { margin-top: auto; position: sticky; bottom: 0; display: grid; gap: 8px; padding: 10px 0 12px; background: var(--bg); border-top: 1px solid var(--line); }
#note { color: var(--you); margin: 0; font-size: 13px; }
#note[hidden] { display: none; }
/* The project the worktree belongs to, as large as the dashboard's page heading. */
h1.project { margin: 0; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
/* The project's name with the service indicator in the upper right; its list opens under them. */
.panel-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.panel-top h1 { min-width: 0; }
.panel-top .service-chip { flex: none; margin-top: 3px; }
.service-pop { top: 46px; left: 12px; right: 12px; width: auto; box-sizing: border-box; max-height: calc(100vh - 60px); overflow-y: auto; }
section.group { gap: 10px; }
/* The row's cells, which the dashboard lays out as table columns, one under another. */
.row-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.row-box.agent-row { box-shadow: inset 3px 0 0 var(--agent); }
.row-box > div { padding: 9px 12px; border-bottom: 1px solid var(--line); }
.row-box > div:last-child { border-bottom: 0; }
.cell-name { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.head { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
.card-cell { min-width: 0; }
.card-cell .id { font-family: var(--font-mono); font-size: 12.5px; }
.card-cell .title { color: var(--fg); font-weight: 600; line-height: 1.3; }
.card-cell .links { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-size: 13px; line-height: 1.35; }
.upd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stands { font-size: 14px; }
.quiet { color: var(--muted); font-size: 13px; margin: 0; }
/* The checkout and the session, which the dashboard does not have. */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .warn { color: var(--you); }
.kv button.orca.ask { margin-left: 10px; font-weight: 400; }
.kv code { font-family: var(--font-mono); font-size: 12px; }
.kv button.orca.wt { text-align: left; }
.session-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.session-head .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.said { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.session-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.session-title h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
.session-title select { flex: 1; min-width: 0; }
select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 8px; max-width: 100%; }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h4 { margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
ul.prompts li { align-items: flex-start; font-size: 13px; color: var(--muted); }
ul.prompts li.newest { color: var(--fg); font-weight: 600; }
ul.prompts .title { white-space: normal; overflow: visible; overflow-wrap: anywhere; }
/* dashboard.css puts a line's time under its title on narrow screens, as the sidebar always is. */
ul.prompts li { flex-wrap: nowrap; }
ul.prompts .title { flex-basis: auto; }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-top">
    <h1 class="project" id="project"></h1>
    <button type="button" class="service-chip" id="service" title="The dashboard service: what it reads, the code it runs, and Restart"><span class="service-dot" aria-hidden="true"></span><span class="service-label">Service</span></button>
  </div>
  <div class="service-pop" id="service-pop" hidden></div>
  <p id="note" hidden></p>
  <div id="main"><p class="quiet">Reading the worktree…</p></div>
</div>
<script src="../row.js"></script>
<script src="panel.js"></script>
</body>
</html>
